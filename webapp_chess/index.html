<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06120a">
  <title>Шах и Чат</title>
  <link rel="icon" href="favicon.png">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board-bg"></div>
  <main id="screen" class="screen"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Главная
    </button>
    <button data-tab="partii">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v6H3zm6 6h6v6H9zm6-6h6v6h-6zM3 15h6v6H3zm12 0h6v6h-6z"/></svg>Партии
    </button>
    <button data-tab="game">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10z"/></svg>Задачи
    </button>
    <button data-tab="top">
      <svg viewBox="0 0 24 24"><path d="M4 13h4v8H4zm6-6h4v14h-4zm6 3h4v11h-4z"/></svg>Рейтинг
    </button>
    <button data-tab="profile">
      <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>Профиль
    </button>
  </nav>

  <div id="beta-bar" class="beta-bar hidden"></div>
  <div id="verdict" class="verdict hidden"></div>
  <div id="modal" class="verdict hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
