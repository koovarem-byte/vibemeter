<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;background:#0e0b1f;font-family:"Inter Display","Inter",sans-serif}
.card{position:absolute;inset:10px;border-radius:44px;border:6px solid #ff9a3c;overflow:hidden;
 background:linear-gradient(160deg,#2a1d6e 0%,#3b1f86 40%,#6a1f7d 75%,#8e2a6b 100%)}
.board{position:absolute;inset:0;opacity:.16;background-image:
 linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
 linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);
 background-size:140px 140px;background-position:0 0,70px 70px}
.horse{position:absolute;right:-40px;top:120px;font-size:560px;line-height:1;color:rgba(0,0,0,.26);font-family:"DejaVu Sans"}
.queen{position:absolute;left:-30px;bottom:-80px;font-size:340px;color:rgba(0,0,0,.24);font-family:"DejaVu Sans"}
.logo{position:absolute;left:52px;top:50px;display:flex;align-items:center;gap:20px;color:#fff;font-weight:900;font-size:38px;letter-spacing:.5px}
.logo img{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:#1d4a26;object-fit:cover}
.pill{position:absolute;right:46px;top:50px;background:#ff8a2b;color:#fff;font-weight:900;font-size:34px;padding:16px 30px;border-radius:999px;border:5px solid #fff}
.h1{position:absolute;left:52px;top:170px;font-weight:900;font-size:118px;line-height:1.02;letter-spacing:-1px;color:#fff;text-shadow:0 7px 0 #150d33}
.h1 .o{color:#ffb35c}
.b{position:absolute;padding:22px 34px;border-radius:26px;font-weight:800;font-size:36px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.b img{position:absolute;width:74px;height:74px;top:-34px;right:-26px}
.b1{left:96px;top:486px;background:#3b3550;transform:rotate(-3deg)}
.b2{right:118px;top:566px;background:#ff8a2b;transform:rotate(2deg)}
.spark{position:absolute;color:#ffd27a;font-size:34px}
</style></head><body><div class="card">
<div class="board"></div><div class="horse">♞</div><div class="queen">♛</div>
<div class="logo"><img src="../../webapp_chess/logo.png">ШАХ И ЧАТ</div>
<div class="pill">БЕТА · РАУНД 2</div>
<div class="h1">ТЕСТ ОТКРЫТ<br><span class="o">+50 МЕСТ</span></div>
<div class="b b1">а старые тестеры?<img src="../../webapp_chess/i/m_dubious.png"></div>
<div class="b b2">тоже заходите)<img src="../../webapp_chess/i/m_brilliant.png"></div>
<span class="spark" style="left:760px;top:150px">✦</span><span class="spark" style="left:1130px;top:210px">✦</span>
<span class="spark" style="left:650px;top:610px">✦</span><span class="spark" style="left:110px;top:650px">✦</span>
</div></body></html>
